name: gather_companion
description: "Gather Companion — know when somebody starts following you in your live Gather V2 session."
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^19.0.0
  # The user's whole Gather identity now lives on the phone, so it goes in the
  # keychain rather than in a preferences plist that device backups include.
  flutter_secure_storage: ^9.2.4
  gather_client:
    path: packages/gather_client
  gather_events:
    path: packages/gather_events
  mobile_scanner: ^7.4.0
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
