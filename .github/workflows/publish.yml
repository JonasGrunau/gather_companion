# Publishes gather-app-bridge to npm via trusted publishing (OIDC).
#
# No NPM_TOKEN anywhere: npm mints a short-lived credential from the OIDC token
# GitHub hands this workflow, which is why `id-token: write` is load-bearing.
# The trusted-publisher entry on npmjs.com is bound to this repository *and this
# filename* — renaming this file breaks publishing until the entry is updated.
#
# Publishing fires on any push to main that touches the tool. The version in
# package.json is therefore the decision, not the act of tagging: bump it and the
# next push ships. Leave it alone and the run *skips* rather than failing — npm
# versions are immutable, so a second publish of the same one is an error, and a
# bridge fix pushed without a bump must not paint main red.
#
# This file is deliberately absent from `paths`: editing the workflow is not
# shipping the tool, and self-triggering on every edit is how you get runs nobody
# asked for. `workflow_dispatch` covers re-running after a registry failure or a
# credential fix.
name: publish

on:
  push:
    branches:
      - main
    paths:
      - 'bridge/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  id-token: write # required — this is what trusted publishing authenticates with
  contents: read

jobs:
  publish:
    # macOS because the package is darwin-only (`"os": ["darwin"]`): it drives
    # launchd and reads the Gather client's macOS log paths. The tests happen to
    # be platform-neutral today, but CI should run where users run.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Nothing to cache — the package has no dependencies, and there is no
          # lockfile, so `npm ci` would fail where `npm test` does not.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm
      # today; upgrading explicitly means a runner-image change cannot silently
      # drop us onto an older CLI that falls back to asking for a token.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # The registry is the only authority on what has already shipped, so ask it
      # rather than inferring from tags or history. This is what turns "pushed a
      # bridge fix without bumping the version" into a skipped publish instead of
      # an immutable-version error.
      - name: Has this version shipped already?
        id: shipped
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::publishing $name@$version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Unconditional: a bridge change that breaks the tests should be loud even
      # on a push that publishes nothing.
      - run: npm test

      # TEMPORARY — diagnosing why npm falls back to token auth instead of OIDC.
      # Remove once publishing works. Prints only whether secrets exist, never
      # their values.
      - name: Diagnose OIDC availability
        run: |
          echo "npm:  $(npm --version)"
          echo "node: $(node --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set:   ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"
          echo "npmrc in use: ${NPM_CONFIG_USERCONFIG:-default}"
          echo "--- npmrc contents, tokens redacted ---"
          sed -E 's/(_authToken=).*/\1<redacted>/' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" || true
          echo "--- what the OIDC claims would say ---"
          echo "repository:       ${GITHUB_REPOSITORY}"
          echo "repository_owner: ${GITHUB_REPOSITORY_OWNER}"
          echo "workflow_ref:     ${GITHUB_WORKFLOW_REF}"

      # No --provenance flag: trusted publishing attaches provenance on its own
      # for a public package from a public repo.
      - if: steps.shipped.outputs.publish == 'true'
        run: npm publish --loglevel verbose
